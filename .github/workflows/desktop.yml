name: Build desktop installer

# Builds the Windows .exe installer on a GitHub-hosted Windows runner, which
# (unlike a locked-down local PC) can run electron-builder's full NSIS pipeline.
# Run it by hand from the Actions tab, or push a tag like v0.1.0 to also publish
# a downloadable Release.

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      - name: Build installer
        working-directory: desktop
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned build; no code-sign cert

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: herd-os-windows-installer
          path: desktop/dist/*.exe
          if-no-files-found: error

      - name: Publish Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
